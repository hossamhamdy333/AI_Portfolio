# ============================================================
# Multi-domain RAG with query routing (LlamaIndex)
# Standalone project -- deliberately does NOT read
# ../rag_chatbot/configs/config.yaml. Different corpus (Wikipedia,
# English, 4 topic domains vs. rag_chatbot's single-domain Arabic news),
# different task (routing + retrieval, not just retrieval), different
# eval metric (routing_accuracy has no equivalent in rag_chatbot). Sharing
# one config across two unrelated projects was more coupling than benefit.
# ============================================================
data:
  source_dataset: "wikimedia/wikipedia"
  source_config: "20231101.en"
  target_per_domain: 300      # articles kept per domain after keyword filtering
  max_articles_scanned: 500000
  random_seed: 42

domains:
  - sports
  - tech
  - history
  - english_literature

synthetic_qa:
  sample_per_domain: 50       # articles sampled per domain for question generation
  questions_per_article: 2    # -> 400 questions total (4 domains x 50 x 2)
  model: "gemini-3.1-flash-lite"

eval:
  # Evaluate on the full set by default -- unlike rag_chatbot, there's no
  # separate "vanilla" implementation to keep a matching sample size with,
  # so there's no reason to sample down from what's available.
  n_questions: 400
  # Checkpoints must be unique per run, not shared/reused across separate
  # attempts -- a real bug in the original version had two different Colab
  # sessions resume from the same checkpoint file at different points and
  # silently produce two different "final" scores for what was supposed to
  # be one run. See notebooks/03_evaluation.ipynb.
  sleep_seconds: 12

router:
  top_k_retrieve: 10

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  # English-only corpus here, unlike rag_chatbot's multilingual-Arabic
  # model -- these are genuinely different choices, not an inconsistency.

llm:
  model: "gemini-3.1-flash-lite"
  temperature: 0.1

qdrant:
  url: https://ff3a5bed-2ea9-4149-a786-2db269606666.us-west-1-0.aws.cloud.qdrant.io
  collection_prefix: "wiki_router"   # actual collections: wiki_router_sports, wiki_router_tech, etc.

cost:
  input_rate_per_million: 0.25
  output_rate_per_million: 1.50

dagshub:
  # Same free hosted-MLflow pattern as rag_chatbot -- see shared/tracking.py.
  # Can point at the same AI_Portfolio repo (different experiment name) or
  # a separate repo if this ends up published standalone.
  repo_owner: "hossamhamdy333"
  repo_name: "AI_Portfolio"

mlflow:
  experiment_name: "rag_router_wikipedia"

serving:
  host: "0.0.0.0"
  port: 7861   # different from rag_chatbot's 7860, in case both run on one HF org
