<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Azure RAG Assistant</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 100px;
    background: #f7f7f8;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

  .panel {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 10px; }

  input[type="file"] { display: block; margin-bottom: 10px; font-size: 0.85rem; }
  button {
    background: #111;
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #333; }

  #status { font-size: 0.85rem; margin-top: 8px; color: #555; }
  #status.error { color: #c0392b; }
  #status.success { color: #1e8e3e; }

  #chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.4;
    font-size: 0.92rem;
    white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #111; color: white; }
  .msg.assistant { align-self: flex-start; background: #eee; color: #111; }
  .msg.assistant.pending { color: #888; font-style: italic; }

  form#chat-form {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #f7f7f8;
    border-top: 1px solid #e5e5e5;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  #query {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <h1>☁️ Azure RAG Assistant</h1>
  <div class="subtitle">Upload a document, then ask questions about it or do some math.</div>

  <div class="panel">
    <h2>Upload a document</h2>
    <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.txt,.md" />
    <button id="upload-btn">Upload &amp; Index</button>
    <div id="status"></div>
  </div>

  <div id="chat"></div>
  <form id="chat-form">
    <input id="query" type="text" placeholder="Ask a question or try: what is 55 * 3" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

<script>
  const API_KEY = "{{ app_api_key }}";
  const headers = API_KEY ? { "X-API-Key": API_KEY } : {};

  const statusEl = document.getElementById("status");
  const uploadBtn = document.getElementById("upload-btn");
  const fileInput = document.getElementById("file-input");
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const queryInput = document.getElementById("query");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) { setStatus("Choose a file first.", "error"); return; }

    uploadBtn.disabled = true;
    setStatus("Uploading and indexing...");

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", headers, body: formData });
      const data = await res.json();
      if (res.ok) {
        let msg = `Indexed ${data.chunks} chunks.`;
        if (!data.blob_url) msg += " (Blob storage archival skipped in this environment.)";
        else msg += " Archived to Azure Blob Storage.";
        setStatus(msg, "success");
      } else {
        setStatus("Upload failed: " + (data.detail || res.statusText), "error");
      }
    } catch (e) {
      setStatus("Could not reach backend: " + e.message, "error");
    } finally {
      uploadBtn.disabled = false;
    }
  });

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = queryInput.value.trim();
    if (!query) return;

    addMessage("user", query);
    queryInput.value = "";
    const pending = addMessage("assistant pending", "Thinking...");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { ...headers, "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      pending.classList.remove("pending");
      pending.textContent = res.ok ? data.answer : "Error: " + (data.detail || res.statusText);
    } catch (err) {
      pending.classList.remove("pending");
      pending.textContent = "Connection to backend failed: " + err.message;
    }
  });
</script>
</body>
</html>
