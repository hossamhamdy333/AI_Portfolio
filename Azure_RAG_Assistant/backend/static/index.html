<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Azure RAG Assistant is a personal portfolio project: a retrieval-augmented generation chatbot with email/password sign-in. Source code: https://github.com/hossamhamdy333/AI_Portfolio" />
<meta name="google-site-verification" content="BSOgk6hUcINoeZHL6C3C7gDo9GRIfj4t-Z1y1NpYVew" />
<title>Azure RAG Assistant</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 100px;
    background: #f7f7f8;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

  .panel {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 10px; }

  input[type="file"] { display: block; margin-bottom: 10px; font-size: 0.85rem; }
  input[type="email"], input[type="password"] {
    display: block;
    width: 100%;
    padding: 9px 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
  }
  button {
    background: #111;
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #333; }
  button.secondary { background: white; color: #111; border: 1px solid #ccc; }
  button.secondary:hover:not(:disabled) { background: #f0f0f0; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }

  #auth-status, #status { font-size: 0.85rem; margin-top: 8px; color: #555; }
  #auth-status.error, #status.error { color: #c0392b; }
  #auth-status.success, #status.success { color: #1e8e3e; }

  #user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.85rem; color: #444; }

  #chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.4;
    font-size: 0.92rem;
    white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #111; color: white; }
  .msg.assistant { align-self: flex-start; background: #eee; color: #111; }
  .msg.assistant.pending { color: #888; font-style: italic; }

  form#chat-form {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #f7f7f8;
    border-top: 1px solid #e5e5e5;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  #query {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.95rem;
  }

  #app { display: none; }
</style>
</head>
<body>
  <h1>☁️ Azure RAG Assistant</h1>
  <div class="subtitle">Upload a document, then ask questions about it or do some math.</div>

  <div id="auth" class="panel">
    <h2>Log in</h2>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="username" />
    <input type="password" id="password" placeholder="Password (8+ characters)" autocomplete="current-password" />
    <div class="row">
      <button id="login-btn">Log in</button>
      <button id="register-btn" class="secondary">Register</button>
    </div>
    <div id="auth-status"></div>
  </div>

  <div id="app">
    <div id="user-bar">
      <span id="user-email"></span>
      <button id="logout-btn" class="secondary">Log out</button>
    </div>

    <div class="panel">
      <h2>Upload a document</h2>
      <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.txt,.md" />
      <button id="upload-btn">Upload &amp; Index</button>
      <div id="status"></div>
    </div>

    <div id="chat"></div>
    <form id="chat-form">
      <input id="query" type="text" placeholder="Ask a question or try: what is 55 * 3" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

<script>
  // Access token lives only in memory - lost on page refresh, which is
  // the point (keeps it out of localStorage, where an XSS bug could read
  // it). The refresh token DOES go in localStorage, so a page reload can
  // silently get a new access token instead of forcing a full re-login
  // every time - see refreshAccessToken() below.
  let accessToken = null;

  function saveRefreshToken(token) { localStorage.setItem("refresh_token", token); }
  function getRefreshToken() { return localStorage.getItem("refresh_token"); }
  function clearRefreshToken() { localStorage.removeItem("refresh_token"); }

  const authEl = document.getElementById("auth");
  const appEl = document.getElementById("app");
  const authStatusEl = document.getElementById("auth-status");
  const statusEl = document.getElementById("status");
  const userEmailEl = document.getElementById("user-email");

  function setAuthStatus(text, cls) {
    authStatusEl.textContent = text;
    authStatusEl.className = cls || "";
  }

  // Reads a response body without throwing on non-JSON (e.g. a plain-text
  // "Internal Server Error" page), so the UI can show a real message.
  async function readJson(res) {
    const raw = await res.text();
    try { return JSON.parse(raw); } catch { return { detail: raw || res.statusText }; }
  }

  // POST for login/register. After a quiet period the database has to wake
  // up, which can take up to a minute: say so, and retry if the server
  // answers with a 5xx in the meantime.
  async function postAuth(url, payload) {
    let res, data;
    const slowTimer = setTimeout(
      () => setAuthStatus("Waking up the database after a quiet period - this can take up to a minute..."),
      4000
    );
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        data = await readJson(res);
        if (res.status < 500) break;
        setAuthStatus("Waking up the server, one moment...");
        await new Promise(r => setTimeout(r, 4000));
      }
    } finally {
      clearTimeout(slowTimer);
    }
    return { res, data };
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  async function showLoggedIn() {
    const res = await fetch("/auth/me", { headers: { Authorization: `Bearer ${accessToken}` } });
    if (!res.ok) throw new Error("token rejected");
    const me = await res.json();
    userEmailEl.textContent = me.email + (me.role === "admin" ? " (admin)" : "");
    authEl.style.display = "none";
    appEl.style.display = "block";
  }

  async function refreshAccessToken() {
    const refreshToken = getRefreshToken();
    if (!refreshToken) return false;

    const res = await fetch("/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) {
      // Only an explicit rejection means the token is bad. A temporary
      // server error (e.g. the database waking up) must NOT throw away a
      // perfectly good login.
      if (res.status === 401 || res.status === 403) clearRefreshToken();
      return false;
    }

    const data = await readJson(res);
    accessToken = data.access_token;
    return true;
  }

  async function handleAuthSuccess(data) {
    accessToken = data.access_token;
    saveRefreshToken(data.refresh_token);
    await showLoggedIn();
  }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    setAuthStatus("Logging in...");
    try {
      const { res, data } = await postAuth("/auth/login", { email, password });
      if (!res.ok) { setAuthStatus(data.detail || "Login failed", "error"); return; }
      await handleAuthSuccess(data);
    } catch (e) {
      setAuthStatus("Could not reach backend: " + e.message, "error");
    }
  });

  document.getElementById("register-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    setAuthStatus("Creating account...");
    try {
      const { res, data } = await postAuth("/auth/register", { email, password });
      if (!res.ok) { setAuthStatus(data.detail || "Registration failed", "error"); return; }
      await handleAuthSuccess(data);
    } catch (e) {
      setAuthStatus("Could not reach backend: " + e.message, "error");
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    const refreshToken = getRefreshToken();
    if (refreshToken) {
      await fetch("/auth/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken }),
      }).catch(() => {});
    }
    clearRefreshToken();
    accessToken = null;
    location.reload();
  });

  // Wraps fetch with the Authorization header, and retries exactly once
  // after a silent token refresh if the server says the access token is
  // no longer valid (it naturally expires every 20 minutes).
  async function authedFetch(url, options = {}) {
    options.headers = { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` };
    let res = await fetch(url, options);
    if (res.status === 401) {
      const refreshed = await refreshAccessToken();
      if (refreshed) {
        options.headers.Authorization = `Bearer ${accessToken}`;
        res = await fetch(url, options);
      }
    }
    return res;
  }

  const uploadBtn = document.getElementById("upload-btn");
  const fileInput = document.getElementById("file-input");
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const queryInput = document.getElementById("query");

  uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) { setStatus("Choose a file first.", "error"); return; }

    uploadBtn.disabled = true;
    setStatus("Uploading and indexing...");

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await authedFetch("/upload", { method: "POST", body: formData });
      const data = await readJson(res);
      if (res.ok) {
        let msg = `Indexed ${data.chunks} chunks.`;
        if (!data.blob_url) msg += " (Blob storage archival skipped in this environment.)";
        else msg += " Archived to Azure Blob Storage.";
        setStatus(msg, "success");
      } else {
        setStatus("Upload failed: " + (data.detail || res.statusText), "error");
      }
    } catch (e) {
      setStatus("Could not reach backend: " + e.message, "error");
    } finally {
      uploadBtn.disabled = false;
    }
  });

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = queryInput.value.trim();
    if (!query) return;

    addMessage("user", query);
    queryInput.value = "";
    const pending = addMessage("assistant pending", "Thinking...");

    try {
      const res = await authedFetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await readJson(res);
      pending.classList.remove("pending");
      pending.textContent = res.ok ? data.answer : "Error: " + (data.detail || res.statusText);
    } catch (err) {
      pending.classList.remove("pending");
      pending.textContent = "Connection to backend failed: " + err.message;
    }
  });

  // On load: either we just got redirected back from Google (tokens are
  // in the URL - see oauth.py's callback), or there's a refresh token
  // from a previous visit to silently resume, or neither and the login
  // form just stays showing.
  (async function init() {
    // Start waking a paused database right away, while the visitor is still
    // typing their email and password. Fire and forget; failures don't matter.
    fetch("/warm").catch(() => {});

    const params = new URLSearchParams(window.location.search);
    if (params.has("access_token") && params.has("refresh_token")) {
      accessToken = params.get("access_token");
      saveRefreshToken(params.get("refresh_token"));
      window.history.replaceState({}, "", window.location.pathname);  // scrub tokens out of the visible URL
      await showLoggedIn();
      return;
    }

    if (getRefreshToken()) {
      const refreshed = await refreshAccessToken();
      if (refreshed) { await showLoggedIn(); return; }
    }
  })();
</script>
</body>
</html>
