name: Azure RAG Assistant CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so config.py's startup validation passes in CI.
      # No real secrets are needed to run the unit tests below.
      GEMINI_API_KEY: ci-dummy
      HF_TOKEN: ci-dummy
      PINECONE_API_KEY: ci-dummy
      PINECONE_INDEX_NAME: omnirag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        working-directory: backend
        run: pytest -v
