model:
  base_model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"

data:
  hf_dataset: "b-mc2/sql-create-context"
  random_seed: 42
  train_size: 3000
  val_size: 300

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  max_seq_length: 512
  logging_steps: 10
  save_steps: 50
  save_total_limit: 2
  warmup_ratio: 0.03
