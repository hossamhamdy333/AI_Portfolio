# Optional - for local development only. The real deployment uses
# docker-compose.prod.yml and does not use this file.
services:
  backend:
    build: ./backend
    container_name: omnirag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Open http://localhost:8000 - that is both the API and the chat page.
