name: rag_chatbot tests

on:
  push:
    paths:
      - 'rag_chatbot/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest pandas numpy scikit-learn PyYAML pydantic
      - name: Run tests
        run: |
          cd rag_chatbot
          pytest tests/ -v
