# ============================================================
# RAG Chatbot pipeline
# ALL hyperparameters live here
# ============================================================

data:
  corpus: "xlsum_arabic"     # XL-Sum Arabic articles
  eval_sample_size: 200      # articles sampled for synthetic Q&A eval set
  random_seed: 42

synthetic_qa:
  questions_per_article: 2
  model: "gemini-3.1-flash-lite"

chunking:
  strategy: "sentence"      # sentence | fixed | semantic
  chunk_size: 256
  overlap: 32
  semantic_similarity_threshold: 0.2

rag:
  top_k_retrieve: 10
  top_k_rerank: 3
  llm_model: "gemini-3.1-flash-lite"
  temperature: 0.7
  max_output_tokens: 1024

retrieval:
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  embedding_dim: 768

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

qdrant:
  host: "localhost"
  port: 6333
  collection_name: "rag_documents"

ragas:
  metrics: ["faithfulness", "answer_relevancy", "context_recall"]

prefect:
  schedule: "0 2 * * *"     # nightly ETL at 2am

cost:
  embedding_rate_per_million: 0.0    # sentence-transformers runs locally
  input_rate_per_million: 0.25       # gemini-3.1-flash-lite input
  output_rate_per_million: 1.50      # gemini-3.1-flash-lite output

mlflow:
  experiment_name: "rag_chatbot"
  tracking_uri: "sqlite:///mlflow.db"

serving:
  host: "0.0.0.0"
  port: 8000 
