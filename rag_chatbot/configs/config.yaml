data:
  random_seed: 42
  dataset_name: "khalidalt/SANAD"
  subset_size: 2000
  raw_path: "data/raw/arabic_news_subset.parquet"
  processed_path: "data/processed/chunks.parquet"

chunking:
  strategy: "sentence"      # sentence | fixed | semantic
  chunk_size: 256
  overlap: 32

embedding:
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  embedding_dim: 768

retrieval:
  top_k_retrieve: 10
  top_k_rerank: 3

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

qdrant:
  collection_name: "arabic_news_chunks"

llm:
  provider: "gemini"
  model_name: "gemini-2.5-flash"
  temperature: 0.2
  max_output_tokens: 1024

pricing:
  gemini_2_5_flash:
    input_per_1k_tokens_usd: 0.000075
    output_per_1k_tokens_usd: 0.0003

supabase:
  table_name: "documents_metadata"

ragas:
  metrics: ["faithfulness", "answer_relevancy", "context_recall"]

prefect:
  schedule: "0 2 * * *"     # daily ETL at 2am

mlflow:
  experiment_name: "rag_chatbot"
  tracking_uri: "file:./mlruns"

serving:
  host: "0.0.0.0"
  port: 8000
