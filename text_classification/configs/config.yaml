# ── Project 01 · Text Classification Pipeline ─────────────────────────────
# Single source of truth for every hyperparameter and path.
# Load in any notebook with:
#   import yaml
#   with open("../configs/config.yaml") as f:
#       cfg = yaml.safe_load(f)

# ── Paths ──────────────────────────────────────────────────────────────────
paths:
  raw_dir:         "data/raw"
  processed_dir:   "data/processed"
  profiles_dir:    "data/profiles"
  models_dir:      "models"
  logs_dir:        "logs"

# ── Datasets ───────────────────────────────────────────────────────────────
data:
  sms_spam:
    url: "https://archive.ics.uci.edu/ml/machine-learning-databases/00228/smsspamcollection.zip"
    filename: "SMSSpamCollection"
    label_col: "label"
    text_col:  "text"
  sst2:
    hf_name: "stanfordnlp/sst2"
    label_col: "label"
    text_col:  "sentence"

  # Split ratios — must sum to 1.0
  splits:
    train: 0.70
    val:   0.15
    test:  0.15
  random_seed: 42

# ── Text Preprocessing ─────────────────────────────────────────────────────
preprocessing:
  lowercase:        true
  remove_urls:      true
  remove_punctuation: false   # keep for BERT — it uses punctuation
  strip_whitespace: true
  min_token_length: 1
  max_seq_length:   128       # shared across all models

# ── Classical Pipeline (Notebook 02) ──────────────────────────────────────
classical:
  tfidf:
    max_features:   20000
    ngram_range:    [1, 2]    # unigrams + bigrams
    sublinear_tf:   true      # apply log(tf) — helps with long docs
    min_df:         2         # ignore terms appearing < 2 times
  logistic_regression:
    C:              1.0
    max_iter:       1000
    solver:         "lbfgs"
    class_weight:   "balanced"
  cross_validation:
    n_splits:       5
    shuffle:        true

# ── Neural Pipeline (Notebook 03) ─────────────────────────────────────────
neural:
  vocab_size:       20000
  embedding_dim:    128
  hidden_dim:       256
  num_layers:       2
  dropout:          0.3
  bidirectional:    true
  training:
    batch_size:     64
    epochs:         10
    learning_rate:  0.001
    clip_grad_norm: 1.0       # gradient clipping
    patience:       3         # early stopping patience

# ── Transformer Pipeline (Notebook 04) ────────────────────────────────────
transformer:
  model_name:       "distilbert-base-uncased"
  training:
    batch_size:         16
    eval_batch_size:    32
    num_epochs:         3
    learning_rate:      2.0e-5
    weight_decay:       0.01
    warmup_ratio:       0.1
    fp16:               true    # mixed precision — free speedup on Colab T4
    logging_steps:      50
    eval_steps:         200
    save_steps:         200
    load_best_model_at_end: true
    metric_for_best_model: "f1"

# ── Evaluation ─────────────────────────────────────────────────────────────
evaluation:
  primary_metric:   "f1"       # what we optimise and compare on
  average:          "binary"   # binary for spam, macro for multi-class
  threshold:        0.5        # decision threshold for probability outputs

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  experiment_name:  "p01_text_classification"
  tracking_uri:     "mlruns"   # local directory — swap for remote URI in prod

# ── Weights & Biases ───────────────────────────────────────────────────────
wandb:
  project:  "nlp-portfolio-p01"
  entity:   null               # set to your W&B username

# ── Serving ────────────────────────────────────────────────────────────────
serving:
  host:             "0.0.0.0"
  port:             8000
  model_path:       "models/distilbert_onnx/model.onnx"
  max_input_length: 128
  onnx_providers:   ["CPUExecutionProvider"]
