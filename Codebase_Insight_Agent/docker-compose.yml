services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      TRACE_FILE: /data/traces.jsonl
    expose:
      - "8000"
    volumes:
      - appdata:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped
volumes:
  appdata:
  caddy_data:
