model:
  name: "gemini-3.1-flash-lite"
  temperature: 0.7
  max_output_tokens: 1024
retry:
  max_attempts: 3
  backoff_seconds: 2

# Which backend actually serves requests: "gemini" (default, API) or
# "ollama"/"vllm" (self-hosted, OpenAI-compatible endpoint - see
# local_client.py). Only the provider's own sub-section below is read;
# the others just sit there ready for whichever you switch to next.
backend:
  provider: "gemini"
  ollama:
    base_url: "http://localhost:11434/v1"
    model: "llama3.1"
  vllm:
    base_url: "http://localhost:8001/v1"
    model: "hossam3759180/support-copilot-merged"

serving:
  host: "0.0.0.0"
  port: 8000

mlflow:
  experiment_name: "llm_api_integration"
  tracking_uri: "https://dagshub.com/hossam3759180/AI_Portfolio.mlflow"
# gemini-3.1-flash-lite's free tier (Google AI Studio) has no per-request dollar cost, but the rates
# are here so cost math is real, not hardcoded to zero — swap in whatever
# model's actual per-million-token pricing if we move off the free tier.
pricing:
  input_cost_per_million: 0.0
  output_cost_per_million: 0.0
