<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Support Copilot</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --text: #e6e8ef;
    --muted: #8b90a1;
    --bubble-user: #6366f1;
    --bubble-bot: #1f2430;
    --border: #262b38;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1a1e2b 0%, var(--bg) 60%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); }
  .status button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 400;
  }

  /* --- auth panel --- */
  #auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  #auth-panel {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  #auth-panel h2 { margin: 0 0 16px; font-size: 16px; }
  #auth-panel input {
    display: block;
    width: 100%;
    background: #0d1420;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    outline: none;
  }
  #auth-panel input:focus { border-color: var(--accent); }
  .auth-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .auth-row button { flex: 1; padding: 10px; font-size: 13.5px; }
  #google-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #auth-status { font-size: 12.5px; margin-top: 10px; color: var(--muted); }
  #auth-status.error { color: var(--error); }

  main {
    flex: 1;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--bubble-user); color: white; border-top-right-radius: 4px; }

  .context-toggle {
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
    margin-top: 6px;
    display: inline-block;
  }
  .context-box {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent-2);
    background: #0d1420;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .context-box.open { display: block; }

  form#chat-form {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 24px 24px;
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 0 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .typing { display: flex; gap: 4px; padding: 6px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

  #app { display: none; flex: 1; flex-direction: column; }
</style>
</head>
<body>

<header>
  <div class="logo">🎧</div>
  <div>
    <h1>AI Support Copilot</h1>
    <p>Fine-tuned Llama-3 (QLoRA) &middot; RAG-grounded responses</p>
  </div>
  <div class="status" id="status-bar">
    <span class="dot"></span> <span id="user-email"></span>
    <button id="logout-btn" style="display:none;">Log out</button>
  </div>
</header>

<div id="auth-wrap">
  <div id="auth-panel">
    <h2>Log in to chat</h2>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="username" />
    <input type="password" id="password" placeholder="Password (8+ characters)" autocomplete="current-password" />
    <div class="auth-row">
      <button id="login-btn">Log in</button>
      <button id="register-btn" style="background: transparent; border: 1px solid var(--border); color: var(--text);">Register</button>
    </div>
    <button id="google-btn">Continue with Google</button>
    <div id="auth-status"></div>
  </div>
</div>

<div id="app">
  <main id="chat"></main>
  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="e.g. Where is my refund?" autocomplete="off" />
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
  // Access token lives only in memory - lost on page refresh (kept out of
  // localStorage so an XSS bug can't read it). The refresh token DOES go
  // in localStorage, so reloading the page can silently get a new access
  // token instead of forcing a full re-login every time.
  let accessToken = null;
  function saveRefreshToken(t) { localStorage.setItem("refresh_token", t); }
  function getRefreshToken() { return localStorage.getItem("refresh_token"); }
  function clearRefreshToken() { localStorage.removeItem("refresh_token"); }

  const authWrap = document.getElementById("auth-wrap");
  const appEl = document.getElementById("app");
  const authStatusEl = document.getElementById("auth-status");
  const userEmailEl = document.getElementById("user-email");
  const logoutBtn = document.getElementById("logout-btn");

  function setAuthStatus(text, cls) {
    authStatusEl.textContent = text;
    authStatusEl.className = cls || "";
  }

  async function refreshAccessToken() {
    const refreshToken = getRefreshToken();
    if (!refreshToken) return false;
    const res = await fetch("/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) { clearRefreshToken(); return false; }
    accessToken = (await res.json()).access_token;
    return true;
  }

  async function authedFetch(url, options = {}) {
    options.headers = { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` };
    let res = await fetch(url, options);
    if (res.status === 401) {
      if (await refreshAccessToken()) {
        options.headers.Authorization = `Bearer ${accessToken}`;
        res = await fetch(url, options);
      }
    }
    return res;
  }

  async function loadHistory() {
    const res = await authedFetch("/chat/history");
    if (!res.ok) return;
    const history = await res.json();
    for (const m of history) {
      addMessage(m.role === "assistant" ? "bot" : "user", m.content);
    }
  }

  async function showLoggedIn() {
    const res = await authedFetch("/auth/me");
    if (!res.ok) throw new Error("token rejected");
    const me = await res.json();
    userEmailEl.textContent = me.email + (me.role === "admin" ? " (admin)" : "");
    logoutBtn.style.display = "inline-block";
    authWrap.style.display = "none";
    appEl.style.display = "flex";

    if (chat.children.length === 0) {
      const history = await authedFetch("/chat/history").then(r => r.ok ? r.json() : []);
      if (history.length > 0) {
        for (const m of history) addMessage(m.role === "assistant" ? "bot" : "user", m.content);
      } else {
        addMessage("bot", "Hello! I'm your AI Support Copilot. How can I help?");
      }
    }
  }

  async function handleAuthSuccess(data) {
    accessToken = data.access_token;
    saveRefreshToken(data.refresh_token);
    await showLoggedIn();
  }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    setAuthStatus("Logging in...");
    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { setAuthStatus(data.detail || "Login failed", "error"); return; }
      await handleAuthSuccess(data);
    } catch (e) {
      setAuthStatus("Could not reach backend: " + e.message, "error");
    }
  });

  document.getElementById("register-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    setAuthStatus("Creating account...");
    try {
      const res = await fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { setAuthStatus(data.detail || "Registration failed", "error"); return; }
      await handleAuthSuccess(data);
    } catch (e) {
      setAuthStatus("Could not reach backend: " + e.message, "error");
    }
  });

  document.getElementById("google-btn").addEventListener("click", () => {
    window.location.href = "/auth/google/login";
  });

  logoutBtn.addEventListener("click", async () => {
    const refreshToken = getRefreshToken();
    if (refreshToken) {
      await fetch("/auth/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken }),
      }).catch(() => {});
    }
    clearRefreshToken();
    accessToken = null;
    location.reload();
  });

  const chat = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(role, text, context) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (role === "bot" && context) {
      const toggle = document.createElement("div");
      toggle.className = "context-toggle";
      toggle.textContent = "🔍 view retrieved context";
      const box = document.createElement("div");
      box.className = "context-box";
      box.textContent = context;
      toggle.onclick = () => box.classList.toggle("open");

      const col = document.createElement("div");
      col.appendChild(bubble);
      col.appendChild(toggle);
      col.appendChild(box);
      wrap.innerHTML = "";
      wrap.appendChild(col);
    }

    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    addMessage("user", query);
    input.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await authedFetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const data = await res.json();
      removeTyping();
      addMessage("bot", data.response, data.context);
    } catch (err) {
      removeTyping();
      addMessage("bot", "⚠️ System error: " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  // On load: either we just got redirected back from Google (tokens are
  // in the URL - see oauth.py's callback), or there's a refresh token
  // from a previous visit to silently resume, or neither and the login
  // form just stays showing.
  (async function init() {
    const params = new URLSearchParams(window.location.search);
    if (params.has("access_token") && params.has("refresh_token")) {
      accessToken = params.get("access_token");
      saveRefreshToken(params.get("refresh_token"));
      window.history.replaceState({}, "", window.location.pathname);
      await showLoggedIn();
      return;
    }
    if (getRefreshToken()) {
      if (await refreshAccessToken()) { await showLoggedIn(); return; }
    }
  })();
</script>

</body>
</html>
