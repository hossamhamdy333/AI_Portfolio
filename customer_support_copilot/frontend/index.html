<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Support Copilot</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --sidebar: #12141c;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --text: #e6e8ef;
    --muted: #8b90a1;
    --bubble-user: #6366f1;
    --bubble-bot: #1f2430;
    --border: #262b38;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); }
  .status button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 400;
  }

  /* --- auth panel --- */
  #auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  #auth-panel {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  #auth-panel h2 { margin: 0 0 16px; font-size: 16px; }
  #auth-panel input {
    display: block;
    width: 100%;
    background: #0d1420;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    outline: none;
  }
  #auth-panel input:focus { border-color: var(--accent); }
  .auth-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .auth-row button { flex: 1; padding: 10px; font-size: 13.5px; }
  #auth-status { font-size: 12.5px; margin-top: 10px; color: var(--muted); }
  #auth-status.error { color: var(--error); }

  /* --- main layout: sidebar + chat --- */
  #app { display: none; flex: 1; overflow: hidden; }

  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    overflow-y: auto;
  }
  #new-chat-btn {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    margin-bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    text-align: left;
  }
  #new-chat-btn:hover { border-color: var(--accent); }
  .convo-item {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .convo-item:hover { background: var(--panel); }
  .convo-item.active { background: var(--panel); color: var(--text); }
  .convo-item .del-btn {
    opacity: 0;
    background: none;
    border: none;
    color: var(--muted);
    padding: 2px 6px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .convo-item:hover .del-btn { opacity: 1; }
  .convo-item .del-btn:hover { color: var(--error); }

  #chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  main {
    flex: 1;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--bubble-user); color: white; border-top-right-radius: 4px; }

  .context-toggle {
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
    margin-top: 6px;
    display: inline-block;
  }
  .context-box {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent-2);
    background: #0d1420;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .context-box.open { display: block; }

  form#chat-form {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 24px 24px;
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 0 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 24px;
  }

  .typing { display: flex; gap: 4px; padding: 6px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
</style>
</head>
<body>

<header>
  <div class="logo">🎧</div>
  <div>
    <h1>AI Support Copilot</h1>
    <p>Your assistant for orders, refunds, accounts &amp; shipping &middot; powered by a fine-tuned Llama-3 (QLoRA) model</p>
  </div>
  <div class="status" id="status-bar">
    <span class="dot"></span> <span id="user-email"></span>
    <button id="logout-btn" style="display:none;">Log out</button>
  </div>
</header>

<div id="auth-wrap">
  <div id="auth-panel">
    <h2>Log in to chat</h2>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="username" />
    <input type="password" id="password" placeholder="Password (8+ characters)" autocomplete="current-password" />
    <div class="auth-row">
      <button id="login-btn">Log in</button>
      <button id="register-btn" style="background: transparent; border: 1px solid var(--border); color: var(--text);">Register</button>
    </div>
    <div id="auth-status"></div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <button id="new-chat-btn">+ New chat</button>
    <div id="convo-list"></div>
  </div>
  <div id="chat-area">
    <main id="chat"></main>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="e.g. Where is my refund?" autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
</div>

<script>
  let accessToken = null;
  let activeConvoId = null;

  function saveRefreshToken(t) { localStorage.setItem("refresh_token", t); }
  function getRefreshToken() { return localStorage.getItem("refresh_token"); }
  function clearRefreshToken() { localStorage.removeItem("refresh_token"); }

  const authWrap = document.getElementById("auth-wrap");
  const appEl = document.getElementById("app");
  const authStatusEl = document.getElementById("auth-status");
  const userEmailEl = document.getElementById("user-email");
  const logoutBtn = document.getElementById("logout-btn");
  const convoListEl = document.getElementById("convo-list");
  const chat = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  // Reads a response body without throwing on non-JSON (e.g. a plain-text
  // "Internal Server Error" page), so the UI can show a real message.
  async function readJson(res) {
    const raw = await res.text();
    try { return JSON.parse(raw); } catch { return { detail: raw || res.statusText }; }
  }

  // POST for login/register. If the server answers 5xx (typically the
  // database waking up after being idle), tell the user and retry.
  async function postAuth(url, payload) {
    let res, data;
    // After a quiet period the database has to wake up, which can take up to a
    // minute. Say so, instead of leaving "Logging in..." on screen.
    const slowTimer = setTimeout(
      () => setAuthStatus("Waking up the database after a quiet period - this can take up to a minute..."),
      4000
    );
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        data = await readJson(res);
        if (res.status < 500) break;
        setAuthStatus("Waking up the server, one moment...");
        await new Promise(r => setTimeout(r, 4000));
      }
    } finally {
      clearTimeout(slowTimer);
    }
    return { res, data };
  }

  function setAuthStatus(text, cls) {
    authStatusEl.textContent = text;
    authStatusEl.className = cls || "";
  }

  async function refreshAccessToken() {
    const refreshToken = getRefreshToken();
    if (!refreshToken) return false;
    const res = await fetch("/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) { clearRefreshToken(); return false; }
    accessToken = (await res.json()).access_token;
    return true;
  }

  async function authedFetch(url, options = {}) {
    options.headers = { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` };
    let res = await fetch(url, options);
    if (res.status === 401) {
      if (await refreshAccessToken()) {
        options.headers.Authorization = `Bearer ${accessToken}`;
        res = await fetch(url, options);
      }
    }
    return res;
  }

  // ---------------------------------------------------------- conversations

  async function loadConversations() {
    const res = await authedFetch("/conversations");
    if (!res.ok) return [];
    return res.json();
  }

  function renderConvoList(convos) {
    convoListEl.innerHTML = "";
    for (const c of convos) {
      const item = document.createElement("div");
      item.className = "convo-item" + (c.id === activeConvoId ? " active" : "");
      item.dataset.id = c.id;

      const label = document.createElement("span");
      label.textContent = c.title;
      label.style.overflow = "hidden";
      label.style.textOverflow = "ellipsis";

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "✕";
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        await authedFetch(`/conversations/${c.id}`, { method: "DELETE" });
        if (activeConvoId === c.id) {
          const remaining = await loadConversations();
          if (remaining.length > 0) {
            await openConversation(remaining[0].id);
          } else {
            await startNewConversation();
          }
        }
        renderConvoList(await loadConversations());
      };

      item.appendChild(label);
      item.appendChild(delBtn);
      item.onclick = () => openConversation(c.id);
      convoListEl.appendChild(item);
    }
  }

  async function openConversation(id) {
    activeConvoId = id;
    chat.innerHTML = "";
    const res = await authedFetch(`/conversations/${id}/messages`);
    const messages = res.ok ? await res.json() : [];
    if (messages.length === 0) {
      chat.innerHTML = '<div id="empty-state">Ask about orders, refunds, accounts, or shipping to get started.</div>';
    } else {
      for (const m of messages) addMessage(m.role === "assistant" ? "bot" : "user", m.content);
    }
    renderConvoList(await loadConversations());
  }

  async function startNewConversation() {
    const res = await authedFetch("/conversations", { method: "POST" });
    if (!res.ok) return;
    const convo = await res.json();
    await openConversation(convo.id);
  }

  document.getElementById("new-chat-btn").addEventListener("click", startNewConversation);

  // ---------------------------------------------------------- auth flow

  async function showLoggedIn() {
    const res = await authedFetch("/auth/me");
    if (!res.ok) throw new Error("token rejected");
    const me = await res.json();
    userEmailEl.textContent = me.email + (me.role === "admin" ? " (admin)" : "");
    logoutBtn.style.display = "inline-block";
    authWrap.style.display = "none";
    appEl.style.display = "flex";

    const convos = await loadConversations();
    if (convos.length > 0) {
      await openConversation(convos[0].id);
    } else {
      await startNewConversation();
    }
  }

  async function handleAuthSuccess(data) {
    accessToken = data.access_token;
    saveRefreshToken(data.refresh_token);
    await showLoggedIn();
  }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    setAuthStatus("Logging in...");
    try {
      const { res, data } = await postAuth("/auth/login", { email, password });
      if (!res.ok) { setAuthStatus(data.detail || "Login failed", "error"); return; }
      await handleAuthSuccess(data);
    } catch (e) {
      setAuthStatus("Could not reach backend: " + e.message, "error");
    }
  });

  document.getElementById("register-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    setAuthStatus("Creating account...");
    try {
      const { res, data } = await postAuth("/auth/register", { email, password });
      if (!res.ok) { setAuthStatus(data.detail || "Registration failed", "error"); return; }
      await handleAuthSuccess(data);
    } catch (e) {
      setAuthStatus("Could not reach backend: " + e.message, "error");
    }
  });

  logoutBtn.addEventListener("click", async () => {
    const refreshToken = getRefreshToken();
    if (refreshToken) {
      await fetch("/auth/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken }),
      }).catch(() => {});
    }
    clearRefreshToken();
    accessToken = null;
    location.reload();
  });

  // ---------------------------------------------------------- chat rendering

  function addMessage(role, text, context) {
    const empty = document.getElementById("empty-state");
    if (empty) empty.remove();

    const wrap = document.createElement("div");
    wrap.className = "msg " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (role === "bot" && context) {
      const toggle = document.createElement("div");
      toggle.className = "context-toggle";
      toggle.textContent = "🔍 view retrieved context";
      const box = document.createElement("div");
      box.className = "context-box";
      box.textContent = context;
      toggle.onclick = () => box.classList.toggle("open");

      const col = document.createElement("div");
      col.appendChild(bubble);
      col.appendChild(toggle);
      col.appendChild(box);
      wrap.innerHTML = "";
      wrap.appendChild(col);
    }

    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // Reads a newline-delimited JSON stream and calls onEvent for each line.
  async function readStream(res, onEvent) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (line) onEvent(JSON.parse(line));
      }
    }
    const rest = buffer.trim();
    if (rest) onEvent(JSON.parse(rest));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query || activeConvoId === null) return;

    addMessage("user", query);
    input.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const payload = { method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ query, conversation_id: activeConvoId }) };

      // Preferred: streaming, so the answer appears as it is written.
      let res = await authedFetch("/chat/stream", { ...payload, headers: { ...payload.headers } });

      if (res.status === 404 || res.status === 405 || !res.body) {
        // Older server without streaming: use the normal endpoint.
        res = await authedFetch("/chat", { ...payload, headers: { ...payload.headers } });
        const data = await readJson(res);
        if (!res.ok) throw new Error(data.detail || `Server responded ${res.status}`);
        removeTyping();
        addMessage("bot", data.response, data.context);
      } else if (!res.ok) {
        const data = await readJson(res);
        throw new Error(data.detail || `Server responded ${res.status}`);
      } else {
        let bubbleWrap = null;
        let bubble = null;
        let shown = "";
        let finished = false;
        await readStream(res, (ev) => {
          if (ev.type === "token") {
            if (!bubbleWrap) {
              removeTyping();
              bubbleWrap = addMessage("bot", "");
              bubble = bubbleWrap.querySelector(".bubble");
            }
            shown += ev.text;
            bubble.textContent = shown;
            chat.scrollTop = chat.scrollHeight;
          } else if (ev.type === "final") {
            finished = true;
            removeTyping();
            if (bubbleWrap) bubbleWrap.remove();
            addMessage("bot", ev.response, ev.context);
          } else if (ev.type === "error") {
            throw new Error(ev.detail || "Stream failed");
          }
        });
        if (!finished) throw new Error("The answer was cut off. Please try again.");
      }
      renderConvoList(await loadConversations()); // picks up auto-generated title
    } catch (err) {
      removeTyping();
      addMessage("bot", "⚠️ System error: " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  (async function init() {
    // Start waking a paused database right away, while the visitor is still
    // typing their email and password. Fire and forget; failures don't matter.
    fetch("/health/db").catch(() => {});

    if (getRefreshToken()) {
      if (await refreshAccessToken()) { await showLoggedIn(); return; }
    }
  })();
</script>

</body>
</html>
