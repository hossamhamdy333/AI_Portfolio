name: Build and deploy to Azure

on:
  push:
    branches: [main]
    # Only redeploy the Azure RAG Assistant when something that is actually
    # part of it changed. This monorepo holds many unrelated projects, and
    # without this filter EVERY push to main (a fix in any other project)
    # rebuilt and restarted this app's container - each restart is a minute
    # or two of downtime, which showed up as random "crashes".
    paths:
      - "Azure_RAG_Assistant/backend/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:  # lets you redeploy by hand from the Actions tab

# One deploy at a time. Uploading several files as separate commits starts
# several runs at once, and whichever FINISHES last becomes the live version -
# which can be an older, partial one. With this, runs queue up in order (and a
# newer queued run replaces an older queued one), so the newest commit is
# always deployed last.
concurrency:
  group: deploy-azure-rag-assistant
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged with the commit SHA, not just :latest. Azure's container
      # config update can silently no-op when the image *reference string*
      # is identical to the previous deploy (":latest" every time), even
      # though the actual image underneath changed - this was an observed,
      # repeated real bug, not a hypothetical. A SHA tag is guaranteed
      # unique per push, so Azure always sees a genuinely new reference and
      # is forced to pull it. :latest is also pushed alongside it, purely
      # for convenience (e.g. manually running `docker pull ...:latest`
      # locally) - it's never what gets deployed.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/azure-rag-assistant:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/azure-rag-assistant:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # Reads from Settings -> Secrets and variables -> Actions ->
          # Variables tab (AZURE_WEBAPP_NAME). Falls back to the old name
          # if that variable isn't set, so this doesn't break anything
          # for a repo that hasn't added it yet. Set the variable to a
          # NEW, never-used-before name to get a fresh, unflagged Azure
          # URL without touching this file again.
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'azure-rag-assistant' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/azure-rag-assistant:${{ github.sha }}
