name: rag-vanilla-vs-langchain tests

on:
  push:
    paths:
      - 'rag-vanilla-vs-langchain/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install shared + impl_vanilla dependencies
        run: |
          cd rag-vanilla-vs-langchain
          pip install -r impl_vanilla/requirements.txt

      - name: Run shared/ tests
        run: |
          cd rag-vanilla-vs-langchain
          PYTHONPATH=shared pytest shared/tests/ -v

      - name: Run impl_vanilla tests
        run: |
          cd rag-vanilla-vs-langchain
          PYTHONPATH=impl_vanilla:. pytest impl_vanilla/tests/ -v

      - name: Install impl_langchain dependencies
        run: |
          cd rag-vanilla-vs-langchain
          pip install -r impl_langchain/requirements.txt

      - name: Run impl_langchain tests
        run: |
          cd rag-vanilla-vs-langchain
          PYTHONPATH=impl_langchain:. pytest impl_langchain/tests/ -v
