name: Deploy Codebase Insight Agent MCP server to Azure Container Apps

# Manual trigger only, on purpose -- this deploys a real, billed Azure
# resource. Automatic deploy-on-push is easy to add later
# (on: push: branches: [main], paths: ['Codebase_Insight_Agent/**']) once
# you're confident this is working and comfortable with it running
# unattended.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          # Points at THIS project's subfolder specifically -- Azure
          # builds the Dockerfile found here, not anything else in the
          # surrounding repo.
          appSourcePath: ${{ github.workspace }}/Codebase_Insight_Agent
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}

# --- SETUP REQUIRED before this workflow can run ---
#
# 1. An Azure Container Registry and a Container App environment must
#    already exist -- this action builds/pushes/deploys to them, it
#    doesn't create them from scratch.
#
# 2. Create a service principal with Contributor access and save its
#    JSON output as the AZURE_CREDENTIALS repo secret:
#      az ad sp create-for-rbac --name "codebase-insight-agent-deploy" \
#        --role contributor \
#        --scopes /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP> \
#        --sdk-auth
#
# 3. Add these repo secrets (Settings -> Secrets and variables -> Actions):
#      AZURE_CREDENTIALS      (the JSON from step 2)
#      ACR_NAME               (your Container Registry name, no domain suffix)
#      CONTAINER_APP_NAME     (your Container App's name)
#      AZURE_RESOURCE_GROUP   (the resource group both of the above live in)
#
# 4. The container app itself needs GOOGLE_API_KEY, QDRANT_URL and
#    QDRANT_API_KEY (without the Qdrant ones it can't find the index and
#    fails at startup) and, optionally,
#    APPLICATIONINSIGHTS_CONNECTION_STRING set as its own secret-backed
#    environment variables in Azure -- NOT as GitHub secrets, since
#    those are for THIS workflow's Azure auth, not the running app's
#    runtime config. Set these via the Azure Portal or:
#      az containerapp update --name <CONTAINER_APP_NAME> \
#        --resource-group <RESOURCE_GROUP> \
#        --set-env-vars GOOGLE_API_KEY=secretref:google-api-key \
#                       QDRANT_URL=secretref:qdrant-url \
#                       QDRANT_API_KEY=secretref:qdrant-api-key
#
#    Since this is now a real public URL, ALSO set (see README's "Remote
#    deployment" section for why): MCP_TRANSPORT=streamable-http,
#    MCP_ACCESS_TOKEN=<a real random secret, e.g. from
#    `python -c "import secrets; print(secrets.token_urlsafe(32))"`>,
#    and MCP_PUBLIC_URL=<this container app's actual URL>. Without
#    MCP_ACCESS_TOKEN set, the server accepts unauthenticated
#    connections from anyone who finds the URL.
#
# 5. Cost control: set a budget alert on the resource group before
#    running this the first time (Container Apps consumption plan +
#    Application Insights ingestion are both usage-based).
