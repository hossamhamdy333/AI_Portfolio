name: Document RAG Assistant tests

on:
  push:
    paths:
      - "Document_RAG_Assistant/backend/**"
      - ".github/workflows/test_document_rag_assistant.yml"
  pull_request:
    paths:
      - "Document_RAG_Assistant/backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Document_RAG_Assistant/backend
    env:
      GEMINI_API_KEY: ci-dummy
      HF_TOKEN: ci-dummy
      QDRANT_URL: http://ci-dummy:6333
      QDRANT_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Document_RAG_Assistant/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
