# ============================================================
# Semantic Search pipeline
# ALL hyperparameters live here
# ============================================================

data:
  corpus: "arxiv"
  subset_size: 50000        # number of papers to index
  random_seed: 42

chunking:
  strategy: "sentence"      # sentence | fixed | semantic
  chunk_size: 256
  overlap: 32

retrieval:
  model_name: "BAAI/bge-base-en-v1.5"
  embedding_dim: 768
  top_k: 50                 # bi-encoder retrieves this many candidates
  rerank_top_k: 5        # cross-encoder re-scores top_k, returns this many

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

qdrant:
  # No host/port/api_key here on purpose - this is a hosted Qdrant Cloud
  # instance, so the connection details are secrets/environment-specific
  # and come from QDRANT_URL / QDRANT_API_KEY (see .env.example).
  collection_name: "arxiv_papers"

faiss:
  index_path: "outputs/indexes/faiss.index"
  index_type: "FlatIP"      # FlatIP = exact search with inner product (cosine)

evaluation:
  metrics: ["mrr", "ndcg", "recall"]
  k_values: [1, 5, 10]

serving:
  host: "0.0.0.0"
  port: 8000
  # Note: async Celery/Redis ingestion was previously listed here but was
  # never actually implemented anywhere in src/ - removed rather than left
  # as a config value pointing at nothing. Ingestion is a one-off script/
  # notebook run (see src/ingest.py); re-add this if you build a real
  # background worker later.
