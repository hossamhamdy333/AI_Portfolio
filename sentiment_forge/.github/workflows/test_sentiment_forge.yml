name: sentiment_forge tests

on:
  push:
    paths:
      - 'sentiment_forge/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest pandas numpy scikit-learn PyYAML datasets
      - name: Run tests
        run: |
          cd sentiment_forge
          pytest tests/ -v
