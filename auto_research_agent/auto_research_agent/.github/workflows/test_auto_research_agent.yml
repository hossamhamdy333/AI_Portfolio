name: test-auto-research-agent

on:
  push:
    paths:
      - "auto_research_agent/**"
  pull_request:
    paths:
      - "auto_research_agent/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto_research_agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest tests/ -v
