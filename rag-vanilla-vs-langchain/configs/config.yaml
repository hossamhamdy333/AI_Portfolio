# ============================================================
# RAG Chatbot pipeline — vanilla vs. LangChain comparison
# ALL hyperparameters live here. Shared by both impl_vanilla/
# and impl_langchain/ so a fair comparison isn't one config
# change away from breaking.
# ============================================================
data:
  corpus: "xlsum_arabic"
  eval_sample_size: 200      # articles sampled for synthetic Q&A eval set
  random_seed: 42

synthetic_qa:
  questions_per_article: 2
  model: "gemini-3.1-flash-lite"

eval:
  # Both implementations score themselves against the same n questions,
  # sampled the same way, via shared/eval_set.py -- see its docstring for
  # why this used to be inconsistent (vanilla scored itself on 30 out of
  # ~400 available questions while langchain used 100; not comparable).
  # Set >= 400 to evaluate on the full set instead of a sample.
  n_questions: 100

chunking:
  # sentence | fixed | semantic
  # "sentence" won the MRR/NDCG comparison in 03_chunking.ipynb
  # (MRR 0.793 / NDCG@10 0.822, vs. 0.784/0.817 for fixed and
  # 0.784/0.821 for semantic) -- previously this was set to "fixed" by
  # mistake, which meant every downstream number was measured on the
  # strategy that lost its own comparison.
  strategy: "fixed"
  chunk_size: 256
  overlap: 32
  semantic_similarity_threshold: 0.2

rag:
  top_k_retrieve: 10
  top_k_rerank: 5
  llm_model: "gemini-3.1-flash-lite"
  temperature: 0.1
  max_output_tokens: 1024

retrieval:
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  embedding_dim: 768

reranker:
  # Same object/model used by both implementations' rerank step, so a
  # metric delta traces back to the retriever architecture, not a second
  # confounding variable.
  model_name: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"

# impl_vanilla's vector store
qdrant:
  # Qdrant Cloud (free tier) instead of local embedded mode -- the old
  # `host: "localhost"` / `port: 6333` keys were dead config left over from
  # assuming a separately-running server; QdrantClient(path=...) (embedded
  # mode) ignored them entirely. Embedded mode also meant the collection
  # only existed inside whatever Colab session built it, so anything
  # serving from it (src/api.py, src/mcp_server.py) only worked from that
  # exact session. A free cluster at https://cloud.qdrant.io gives a real
  # URL any of them can connect to from anywhere -- fill this in after
  # creating one; the API key is read from QDRANT_API_KEY, never put here.
  url: https://ff3a5bed-2ea9-4149-a786-2db269606666.us-west-1-0.aws.cloud.qdrant.io
  collection_name: "rag_documents"

# impl_langchain's vector store (ParentDocumentRetriever's child index)
chroma:
  collection_name: "rag_documents_langchain"
  persist_directory: "./data/chroma_db"

ragas:
  metrics: ["faithfulness", "answer_relevancy", "context_recall"]

cost:
  embedding_rate_per_million: 0.0    # sentence-transformers runs locally
  input_rate_per_million: 0.25       # gemini-3.1-flash-lite input
  output_rate_per_million: 1.50      # gemini-3.1-flash-lite output

dagshub:
  # DagsHub hosts a free MLflow tracking server per connected repo, so runs
  # are viewable at a real URL instead of a local sqlite file only you can
  # open. Connect this GitHub repo at https://dagshub.com first, then set
  # these to match (see shared/tracking.py for the one-time setup steps).
  repo_owner: "hossam3759180"
  repo_name: "AI_Portfolio"

mlflow:
  experiment_name: "rag_chatbot_comparison"

serving:
  # Used by the Dockerfile deploying src/api.py to Hugging Face Spaces --
  # Spaces expects the app to listen on 7860, not the 0.0.0.0:8000 this
  # used to hardcode for local/Colab-only `uvicorn` runs. Deployed there,
  # the API has a real persistent URL instead of dying with the Colab
  # session that started it (see impl_vanilla/Dockerfile).
  host: "0.0.0.0"
  port: 7860
